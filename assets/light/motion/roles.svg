  </rect>
  <g font-family="ui-sans-serif, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#1F2328">
    <text x="72" y="42">Design Lead</text>
    <text x="250" y="42" fill="#59636E">·</text>
    <text x="272" y="42" fill="#0969DA">Agentic Designer</text>
    <text x="458" y="42" fill="#59636E">·</text>
    <text x="480" y="42">UI/UX · Research · No-code</text>
  </g>
  <circle cx="860" cy="36" r="7" fill="#0969DA">
